packages:
  - '!frontend'
  - '!frontend/**'

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true
  protobufjs: true
  cpu-features: false
  esbuild: false
  ssh2: false
  unrs-resolver: false

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - axios@1.16.0
  - axios@1.15.0
  - axios@1.15.1
  - axios@1.15.2

overrides:
  axios@>=1.0.0 <1.15.0: ^1.15.0
  axios@>=1.0.0 <1.15.1: ^1.15.1
  axios@>=1.0.0 <1.15.2: ^1.15.2
  axios@>=1.0.0 <1.16.0: ^1.16.0
  uuid@<11.1.1: ^11.1.1
