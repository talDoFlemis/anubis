services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/db.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ghcr.io/taldoflemis/anubis/migrate:latest
    environment:
      NODE_ENV: production
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    image: ghcr.io/taldoflemis/anubis:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME}

      APP_PREFIX: /api
      APP_PORT: 3000
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      AUTH_CONFIRM_EMAIL_SECRET: ${AUTH_CONFIRM_EMAIL_SECRET}
      AUTH_CONFIRM_EMAIL_EXPIRES_IN: ${AUTH_CONFIRM_EMAIL_EXPIRES_IN:-1d}
      AUTH_FORGOT_SECRET: ${AUTH_FORGOT_SECRET}
      AUTH_FORGOT_EXPIRES_IN: ${AUTH_FORGOT_EXPIRES_IN:-30m}

      FRONTEND_URL: ${FRONTEND_URL}

      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_FROM: ${MAIL_DEFAULT_FROM}

      MAIL_GOOGLE_CLIENT_ID: ${MAIL_GOOGLE_CLIENT_ID}
      MAIL_GOOGLE_CLIENT_SECRET: ${MAIL_GOOGLE_CLIENT_SECRET}
      MAIL_GOOGLE_REFRESH_TOKEN: ${MAIL_GOOGLE_REFRESH_TOKEN}
      MAIL_GOOGLE_USER: ${MAIL_GOOGLE_USER}

      SYSTEM_SECRET: ${SYSTEM_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://api:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 1
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget http://localhost:8025 -O /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/taldoflemis/anubis/frontend:latest
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://frontend:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: cgr.dev/chainguard/nginx:latest-dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://nginx/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
    internal: true
  edge:
    driver: bridge
